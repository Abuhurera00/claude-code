[package]
name = "claude-code"
version = "0.1.0"
edition = "2024"

[dependencies]
anthropic-ai-sdk = "0.2.27"
anyhow = "1.0.102"
async-openai = { version = "0.41.1", features = ["chat-completion"] }
async-trait = "0.1.89"
dotenvy = "0.15.7"
inquire = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "rt", "process", "time", "fs"] }
